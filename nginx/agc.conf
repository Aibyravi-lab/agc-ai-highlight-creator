# AGC AI Highlight Creator — Nginx Configuration
# Deploy to: /etc/nginx/sites-available/agc
# Enable with: sudo ln -s /etc/nginx/sites-available/agc /etc/nginx/sites-enabled/agc
#
# Requires:
#   - certbot: sudo apt install certbot python3-certbot-nginx
#   - Certs:   sudo certbot --nginx -d vedzovi.com -d www.vedzovi.com -d api.vedzovi.com
#
# Services expected on this server:
#   - Next.js frontend:  127.0.0.1:3000
#   - FastAPI backend:   127.0.0.1:8000

# ─── HTTP → HTTPS redirect (all domains) ────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name vedzovi.com www.vedzovi.com api.vedzovi.com upload.vedzovi.com;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Frontend: vedzovi.com / www.vedzovi.com ────────────────────────────────

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vedzovi.com www.vedzovi.com;

    ssl_certificate     /etc/letsencrypt/live/vedzovi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vedzovi.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/vedzovi.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    server_tokens off;

    # HSTS — 1 year; tells browsers to always use HTTPS for this domain
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # www → apex redirect
    if ($host = www.vedzovi.com) {
        return 301 https://vedzovi.com$request_uri;
    }

    client_max_body_size 500m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/css
        application/javascript
        application/json
        text/plain
        text/xml
        application/xml
        image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

# ─── Backend API: api.vedzovi.com ───────────────────────────────────────────

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.vedzovi.com;

    ssl_certificate     /etc/letsencrypt/live/vedzovi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vedzovi.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/vedzovi.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Allow large video uploads
    client_max_body_size 500m;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/css
        application/javascript
        application/json
        text/plain
        text/xml
        application/xml
        image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
    }
}

# ─── Upload API: upload.vedzovi.com (VED-P1-004) ────────────────────────────
#
# DNS-only (grey-clouded, not proxied through Cloudflare) — Cloudflare's Free
# plan hard-caps proxied request bodies at 100MB, which blocks the 1-2GB
# gameplay uploads this app needs to accept. Every other hostname
# (vedzovi.com, www.vedzovi.com, api.vedzovi.com) stays orange-clouded and
# unaffected. Only /upload/ is exposed here — auth, payments, ops, and every
# other route stay reachable exclusively through api.vedzovi.com. Requests
# still carry a JWT (validated by the same FastAPI app on :8000) and are
# subject to the existing per-user rate limit and MIME/extension validation
# in the upload router, so losing Cloudflare's edge WAF/DDoS/bot protection
# on this one path is offset by those app-level checks.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name upload.vedzovi.com;

    ssl_certificate     /etc/letsencrypt/live/vedzovi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vedzovi.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/vedzovi.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 1-2GB gameplay uploads; matches MAX_UPLOAD_SIZE_MB=2000 in backend/.env
    # and UPLOAD_TIMEOUT_MS in frontend/services/api.ts.
    client_max_body_size 2048m;
    client_body_timeout 1800s;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;

    # Only the upload endpoint is reachable on this hostname — no location /
    # fallback, so every other path (including api.vedzovi.com's other
    # routes) 404s here by nginx's default unmatched-location behavior.
    location /upload/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
    }
}
